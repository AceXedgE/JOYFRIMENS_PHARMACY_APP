# Free trial template. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: joyfrimens
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node backend/dist/cli.js migrate && node backend/dist/server.js
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: joyfrimens-db
          property: connectionString
databases:
  - name: joyfrimens-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: joyfrimens
    user: joyfrimens
    ipAllowList: []
